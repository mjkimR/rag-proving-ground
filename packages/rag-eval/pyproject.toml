[project]
name = "rag-eval"
version = "0.1.0"
description = "Evaluation package for the RAG scaffold (Ragas, DeepEval)"
requires-python = ">=3.13"
dependencies = [
    "rag-core",
    "ragas>=0.4.3",
    "deepeval>=4.0.6",
    "datasets",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rag_eval"]

[tool.uv.sources]
rag-core = { workspace = true }

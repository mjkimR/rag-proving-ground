[project]
name = "rag-graphs"
version = "0.1.0"
description = "LangGraph definitions for RAG pipelines"
requires-python = ">=3.13"
dependencies = [
    "langchain>=1.3.2",
    "langchain-core>=1.4.0",
    "langgraph>=1.2.2",
    "rag-core",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rag_graphs"]

[tool.uv.sources]
rag-core = { workspace = true }

[project]
name = "rag-graphs"
version = "0.1.0"
description = "LangGraph definitions for RAG pipelines"
requires-python = ">=3.13"
dependencies = [
    "app-http-client",
    "httpx>=0.28.1",
    "langchain>=1.3.2",
    "langchain-core>=1.4.0",
    "langgraph>=1.2.2",
    "pydantic-settings>=2.6.0",
    "rag-core",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rag_graphs"]

[tool.uv.sources]
app-http-client = { git = "https://github.com/mjkimR/app-common.git", subdirectory = "app-http-client", rev = "main" }
rag-core = { workspace = true }

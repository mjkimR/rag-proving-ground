[project]
name = "rag-core"
version = "0.1.0"
description = "Shared RAG parsing, chunking, document, and model utilities"
requires-python = ">=3.13"
dependencies = [
    "httpx>=0.28.1",
    "langchain-core>=1.4.0",
    "langchain-litellm>=0.6.4",
    "langchain-text-splitters>=1.1.2",
    "litellm[proxy]>=1.55.0",
    "loguru>=0.7.3",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rag_core"]

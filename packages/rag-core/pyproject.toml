[project]
name = "rag-core"
version = "0.1.0"
description = "Shared RAG parsing, chunking, document, and model utilities"
requires-python = ">=3.13"
dependencies = [
    "aiocache[redis]>=0.12.3",
    "app-file-storage",
    "app-http-client",
    "cachetools>=7.1.4",
    "fastembed>=0.8.0",
    "httpx>=0.28.1",
    "langchain-core>=1.4.0",
    "langchain-litellm>=0.6.4",
    "langchain-qdrant>=1.0.0",
    "langchain-text-splitters>=1.1.2",
    "litellm>=1.55.0",
    "loguru>=0.7.3",
    "markdown-it-py>=4.2.0",
    "pillow>=12.2.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "pypdfium2>=5.10.1",
    "qdrant-client>=1.12.1",
    "tiktoken>=0.13.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rag_core"]

[tool.uv.sources]
app-file-storage = { git = "https://github.com/mjkimR/app-common.git", subdirectory = "app-file-storage", rev = "main" }
app-http-client = { git = "https://github.com/mjkimR/app-common.git", subdirectory = "app-http-client", rev = "main" }

[dependency-groups]
dev = [
    "pytest-asyncio>=1.4.0",
    "respx>=0.23.1",
]

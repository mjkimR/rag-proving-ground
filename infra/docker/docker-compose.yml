services:
  litellm:
    image: ghcr.io/berriai/litellm:main-latest
    container_name: litellm-proxy
    ports:
      - "14004:4000"
    volumes:
      - ../../models.yaml:/app/config.yaml
    environment:
      DATABASE_URL: "postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@rag-meta-db:5432/litellm"
    command: [ "--config", "/app/config.yaml", "--port", "4000" ]

  rag-storage-object:
    image: minio/minio:latest
    container_name: rag-storage-object
    ports:
      - "19000:9000"
      - "19001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    volumes:
      - storage_object_data:/data
    command: server /data --console-address ":9001"

  rag-vector-db:
    image: qdrant/qdrant:latest
    container_name: rag-vector-db
    ports:
      - "16333:6333"
      - "16334:6334"
    volumes:
      - vector_db_data:/qdrant/storage

  rag-meta-db:
    image: postgres:16-alpine
    container_name: rag-meta-db
    ports:
      - "15431:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-rag}
    volumes:
      - meta_db_data:/var/lib/postgresql/data

  docling:
    image: quay.io/docling-project/docling-serve-cpu:latest
    container_name: docling-serve-cpu
    ports:
      - "15001:5001"
    environment:
      - DOCLING_SERVE_ENABLE_UI=true
    profiles:
      - docling
      - parser
      - basic

volumes:
  storage_object_data:
  vector_db_data:
  meta_db_data:

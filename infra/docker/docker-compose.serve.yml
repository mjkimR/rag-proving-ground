# Docker Compose override
# Run from the repository root:
#   docker compose -p rag -f infra/docker/docker-compose.yml -f infra/docker/docker-compose.serve.yml --profile serve up --build

services:
  rag-serve:
    build:
      context: ../..
      dockerfile: apps/serve/Dockerfile
    container_name: rag-serve
    ports:
      - "${PORT:-2026}:${PORT:-2026}"
    env_file:
      - path: ../../apps/serve/.env
        required: false
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - POSTGRES_HOST=rag-meta-db
      - POSTGRES_PORT=5432
      - POSTGRES_DB=${POSTGRES_DB:-rag}
      - AEGRA_CONFIG=/app/apps/serve/aegra.json
      - AUTH_TYPE=${AUTH_TYPE:-noop}
      - PORT=${PORT:-2026}
      - REDIS_BROKER_ENABLED=true
      - REDIS_URL=redis://rag-redis:6379/0
      - PYTHONPATH=/app/packages/graphs/src:/app/packages/rag-core/src
    depends_on:
      rag-meta-db:
        condition: service_healthy
      rag-redis:
        condition: service_healthy
    healthcheck:
      test: [ "CMD-SHELL", "curl -sf http://localhost:${PORT:-2026}/health || exit 1" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    volumes:
      - ../../apps/serve/aegra.json:/app/apps/serve/aegra.json:ro
      - ../../packages/graphs/src:/app/packages/graphs/src:ro
      - ../../packages/rag-core/src:/app/packages/rag-core/src:ro
    profiles:
      - serve

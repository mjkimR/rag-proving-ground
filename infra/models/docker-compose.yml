services:
  infinity-colpali:
    image: michaelf34/infinity:latest
    container_name: local-infinity-colpali
    ports:
      - "7997:7997"
    volumes:
      - ~/.ai_models/infinity:/app/.cache
    command: v2 --model-id vidore/colpali-v1.3-merged --dtype bfloat16 --device cpu --engine torch --port 7997

networks:
  default:
    name: rag-network
    external: true

services:
  litellm:
    image: ghcr.io/berriai/litellm:main-latest
    container_name: litellm-proxy
    env_file:
      - ../../.env
      - path: ${HOME}/.keys
        required: false
    ports:
      - "14004:4000"
    volumes:
      - ../../models.yaml:/app/config.yaml
    environment:
      DATABASE_URL: "postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@rag-meta-db:5432/litellm"
      LITELLM_DROP_PARAMS: "True"
    command: [ "--config", "/app/config.yaml", "--port", "4000" ]

  rag-storage-object:
    image: minio/minio:latest
    container_name: rag-storage-object
    ports:
      - "19000:9000"
      - "19001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    volumes:
      - storage_object_data:/data
    command: server /data --console-address ":9001"

  rag-vector-db:
    image: qdrant/qdrant:latest
    container_name: rag-vector-db
    ports:
      - "16333:6333"
      - "16334:6334"
    volumes:
      - vector_db_data:/qdrant/storage

  rag-meta-db:
    image: pgvector/pgvector:pg18
    container_name: rag-meta-db
    ports:
      - "15431:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-rag}
    volumes:
      - meta_db_data:/var/lib/postgresql
      - ./init-db.sh:/docker-entrypoint-initdb.d/init-db.sh
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-rag}" ]
      interval: 5s
      timeout: 5s
      retries: 5

  docling:
    image: quay.io/docling-project/docling-serve-cpu:latest
    container_name: docling-serve-cpu
    ports:
      - "15001:5001"
    environment:
      - DOCLING_SERVE_ENABLE_UI=true
    profiles:
      - docling
      - parser
      - basic

  fast-parser:
    image: ghcr.io/mjkimr/fast-parser:latest
    container_name: fast-parser
    ports:
      - "15002:8000"
    profiles:
      - fast-parser
      - parser
      - basic

  rag-redis:
    image: redis:7-alpine
    container_name: rag-redis
    ports:
      - "16379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 5s
      retries: 5

  redis-insight:
    image: redis/redisinsight:latest
    container_name: redis-insight
    ports:
      - "18001:5540"
    volumes:
      - redis_insight_data:/db
    profiles:
      - basic
      - redis

volumes:
  storage_object_data:
  vector_db_data:
  meta_db_data:
  redis_data:
  redis_insight_data:

networks:
  default:
    name: rag-network

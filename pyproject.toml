[project]
name = "rag-experiment"
version = "0.1.0"
description = "Modular RAG experimentation and serving scaffold"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "aiobotocore>=3.7.0",
    "aegra-cli>=0.9.17",
    "rag-core",
    "rag-graphs",
]

[dependency-groups]
dev = [
    "ruff>=0.15.14",
    "pyright>=1.1.409",
    "pytest>=8.3.5",
    "pytest-asyncio>=0.26.0",
    "pytest-mock>=3.15.0",
    "testcontainers[postgres]>=4.14.2",
    "polyfactory>=3.2.0",
]

[tool.uv]
package = false
override-dependencies = [
    "tokenizers>=0.21.0"
]

[tool.uv.workspace]
members = [
    "apps/backend",
    "packages/graphs",
    "packages/rag-core",
    "packages/rag-eval",
    "apps/web",
]

[tool.uv.sources]
rag-core = { workspace = true }
rag-graphs = { workspace = true }
rag-eval = { workspace = true }

[tool.ruff]
exclude = [".git", ".venv", "migrations"]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"**/tests/**/*.py" = ["F403", "E402"]
"__init__.py" = ["F403"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pyright]
venvPath = "."
venv = ".venv"
pythonVersion = "3.13"
typeCheckingMode = "basic"
extraPaths = [
    "./packages/graphs/src",
    "./packages/rag-core/src",
    "./packages/rag-eval/src",
    "./apps/backend",
]

[tool.pytest.ini_options]
log_level = "INFO"
pythonpath = [
    "packages/graphs/src",
    "packages/rag-core/src",
    "packages/rag-eval/src",
    "apps/backend",
]
testpaths = [
    "packages/rag-core/tests",
    "packages/graphs/tests",
    "packages/rag-eval/tests",
    "apps/backend/tests"
]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "real_commit: use TRUNCATE strategy instead of savepoint rollback (allows real commits)",
]
